[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyad_apis"
dynamic = ["version"]
description = "Async Python wrappers for the Ayyad APIs (YouTube, NSFW moderation, TubeRelay, Anghami, TikTok)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ahmed Ayyad", email = "contact@ahmedayyad.dev" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp",
    "aiofiles",
]

[project.urls]
Homepage = "https://github.com/ahmedayyad-dev/Ayyad-APIs"

[tool.setuptools.dynamic]
version = {attr = "ayyad_apis.__version__"}

[tool.setuptools.packages.find]
include = ["ayyad_apis*"]

[tool.setuptools.package-data]
ayyad_apis = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

